<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#8C8F7B">
<title>An Invitation</title>
<meta name="description" content="A private invitation.">
<link rel="stylesheet" href="css/fonts-embedded.css?v=50cb9fbb">
<link rel="stylesheet" href="css/style.css?v=7bff196d">
<link rel="icon" href="data:,">
</head>
<body>

  <!-- Loading state: shown immediately, replaced as soon as unlock.js resolves -->
  <div id="loading" class="state-screen" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <!-- Neutral fallback: shown for no link, a broken link, or any decrypt failure.
       Deliberately reveals nothing about the guests or the plans. Shown before
       any content is decrypted, so we don't yet know the guest's language: the
       message is given in all three languages at once. -->
  <div id="fallback" class="state-screen" hidden>
    <div class="fallback-card">
      <p class="fallback-mark" aria-hidden="true">&#10022;</p>
      <p class="fallback-line">This link isn't quite right. Please use the personal invitation link you were sent.</p>
      <p class="fallback-line">Bu bağlantı doğru görünmüyor. Lütfen size gönderilen kişisel davet bağlantısını kullanın.</p>
      <p class="fallback-line">Dieser Link scheint nicht zu stimmen. Bitte verwende den persönlichen Einladungslink, den du erhalten hast.</p>
    </div>
  </div>

  <!-- The sealed envelope. Sits above #app once the bundle is decrypted and is
       dismissed by envelope.js on the first tap, which is also what starts the
       page's own entrance animations (see js/envelope.js). -->
  <div id="envelope" class="envelope" hidden>
    <div class="env-grow" id="env-grow">
      <div class="env-stage">
        <div class="env-paper" id="env-paper" role="button" tabindex="0" aria-describedby="env-hint">
          <div class="env-front">
            <div class="env-flap" aria-hidden="true"></div>
            <div class="env-address">
              <span class="env-to" id="env-to"></span>
              <span class="env-rule" aria-hidden="true"></span>
            </div>
            <div class="env-pocket" aria-hidden="true"></div>
            <div class="env-seal" id="env-seal" aria-hidden="true"><span></span></div>
          </div>
          <!-- The face the guest lands on. Deliberately a flat colour and
               nothing else: a layer being scale-animated is rasterised once
               at its starting size, so any texture, border or radius here
               would go soft and distort on the way up. The letter's real
               paper is #letter, underneath. -->
          <div class="env-back" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <p class="env-hint" id="env-hint" data-bind="card.openHint"></p>
  </div>

  <!-- Real content: rendered by render.js once a guest bundle is decrypted.
       Sections for the part(s) a guest wasn't invited to don't exist in
       their decrypted bundle at all (see tools/build-invites.mjs pruning),
       so render.js removes the matching markup below entirely rather than
       just hiding it: nothing about the other part ships to their page. -->
  <div id="app" hidden>

    <!-- Page level rather than inside #card, so it is reachable from any
         section. It is hidden while the guest is on the letter; see the
         .over-letter rule in css/style.css. -->
    <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="tr">TR</button>
      <button type="button" data-lang="de">DE</button>
    </div>

    <main>

      <!-- The letter the envelope turns into. Filled by render.js
           (renderLetter) and animated by js/letter.js.

           Deliberately NOT class="section": .section carries the green
           page's fade-up entrance and is what render.js's scroll-cue
           lookup and main.js's reveal observer both select on. A .section
           sitting above #card would make the card's own scroll cue point
           back up at the letter. -->
      <section id="letter" class="letter" tabindex="-1" aria-labelledby="letter-title">
        <!-- The paper, and the box js/envelope.js measures and grows the
             envelope into. The beige around it belongs to #letter and is the
             same gradient the envelope overlay is painted with, so the card
             lands on the ground it took off from. -->
        <div class="letter-paper" id="letter-paper">
          <div class="letter-flora" aria-hidden="true">
            <span class="fl fl-tl"></span>
            <span class="fl fl-tr"></span>
            <span class="fl fl-bl"></span>
            <span class="fl fl-br"></span>
          </div>
          <div class="letter-inner">
            <h1 class="letter-title" id="letter-title"><!-- populated by render.js --></h1>
            <div class="letter-body" id="letter-body"><!-- populated by render.js --></div>
            <p class="letter-signoff" id="letter-signoff"></p>
            <p class="letter-names" id="letter-names"></p>
          </div>
        </div>
        <!-- A real control, not just a label: it is the arrow the guest is
             being pointed at, and js/paging.js takes a click on it as the
             gesture that pages down to the card. -->
        <p class="letter-hint" id="letter-hint" role="button" tabindex="0"></p>
      </section>

      <section id="card" class="section card">
        <div class="card-inner">
          <h2 class="card-names" id="card-names"></h2>
          <div class="card-rule" aria-hidden="true"><span></span></div>

          <div class="card-meta" id="card-meta"><!-- populated by render.js --></div>

          <div class="card-foot">
            <!-- This is the countdown's home, not where it ends up.
                 renderCardMeta() in js/render.js moves it into the column
                 of the part it counts to, so its position says which of
                 the dates above it means and no wording has to. It stays
                 here only for a guest who has no date yet, where it is
                 hidden anyway. -->
            <div class="countdown" id="countdown" aria-live="off" hidden>
              <span class="countdown-num" id="cd-days">&nbsp;</span>
              <span class="countdown-label" data-bind="card.countdownLabel"></span>
            </div>
            <a class="scroll-cue" id="scroll-cue" href="#" data-bind="card.scrollCue"></a>
          </div>
        </div>
      </section>

      <!-- The one composed section on the site. Its steps, the two photo
           insets between them and the drawn connectors that link them are
           all built by renderFlow() in js/render.js from a layout table
           that lives there (FLOWS.denmark): the arrangement is design,
           not copy, so it is not repeated three times in content/*.json.
           The Barcelona days below use the same builder. -->
      <section id="denmark" class="section flow-wide" hidden>
        <p class="kicker" data-bind="denmark.kicker"></p>
        <h2 class="section-title" data-bind="denmark.title"></h2>
        <ol class="flow" id="denmark-flow"><!-- populated by render.js --></ol>
        <p class="section-note travel-note" data-bind="denmark.travelNote"></p>
      </section>

      <!-- Barcelona. A centred opening (where, when, how far from the
           airport, a map that is also the link to it, the address), then
           the house: the copy, and four photographs in a scroller.

           Every path here is set by render.js from the guest's bundle,
           the map's src included, and none of them is written in this
           file. A guest whose #place applyEventScope() removed therefore
           never requests any of the files, which is the point: assets/
           is browsable on the public repo, so a request is a tell. -->
      <section id="place" class="section" hidden>
        <div class="place-hero">
          <p class="kicker" data-bind="place.kicker"></p>
          <h2 class="place-title" data-bind="place.title"></h2>
          <p class="place-line" data-bind="place.dateLine"></p>
          <p class="place-line place-travel" data-bind="place.travelLine"></p>

          <!-- No src and no width/height on purpose: the src is a fact and
               comes from the bundle (see renderPlace), the box comes from
               .map-link's aspect-ratio. The <a> carries the accessible
               name, so the <img> inside it stays alt="". -->
          <a class="map-link" id="place-map" href="#" target="_blank" rel="noopener"
             data-bind-attr-aria-label="place.mapLabel">
            <img id="place-map-img" alt="" decoding="async">
          </a>

          <p class="place-address" id="place-address"><!-- populated by render.js --></p>
        </div>

        <p class="section-body" data-bind="place.body"></p>

        <ul class="carousel" id="place-photos" role="group" tabindex="0"
            data-bind-attr-aria-label="place.photosLabel"><!-- populated by render.js --></ul>
        <!-- Starts hidden, and js/main.js only unhides it once there is
             more than one photograph to point at. A row of one dot is
             furniture, and a guest with no photographs at all should not
             be told there is something to swipe. -->
        <div class="carousel-dots" id="place-dots" aria-hidden="true" hidden><!-- populated by main.js --></div>

        <div class="button-row">
          <a class="btn btn-line" id="place-listing" href="#" target="_blank" rel="noopener" data-bind-text="place.listingLabel"></a>
        </div>
        <p class="section-note" data-bind="place.note"></p>
      </section>

      <!-- The days. The same composed flow as Copenhagen at its compact
           setting: no photographs, one connector instead of three, two
           columns that sit abreast rather than overlapping, and smaller
           type. The arrangement is FLOWS.plan in js/render.js. -->
      <section id="plan" class="section flow-mid" hidden>
        <p class="kicker" data-bind="plan.kicker"></p>
        <h2 class="section-title" data-bind="plan.subtitle"></h2>
        <p class="section-body plan-lead" data-bind="plan.lead"></p>
        <ol class="flow flow-tight" id="plan-flow"><!-- populated by render.js --></ol>
      </section>

      <section id="practical" class="section" hidden>
        <p class="kicker" data-bind="practical.kicker"></p>

        <div class="panel">
          <p class="cost-amount" id="cost-amount"></p>
          <p class="cost-pernight" data-bind="practical.perNight"></p>
          <p class="panel-body" data-bind="practical.costBody"></p>
          <p class="panel-body" data-bind="practical.coverNote"></p>
          <div class="pay-row">
            <a class="btn btn-solid" id="paypal-link" href="#" target="_blank" rel="noopener" data-bind-text="practical.paypalLabel"></a>
            <div class="qr-wrap" id="qr-wrap" aria-hidden="true"></div>
          </div>
          <p class="fineprint" data-bind="practical.paypalNote"></p>
        </div>

        <p class="section-note" data-bind="practical.travelNote"></p>

        <h3 class="sub-title" data-bind="practical.bringTitle"></h3>
        <p class="section-body" data-bind="practical.weatherNote"></p>
        <ul class="check-list" id="bring-list"><!-- populated by render.js --></ul>
      </section>

      <section id="rsvp" class="section">
        <p class="kicker" data-bind="rsvp.kicker"></p>
        <h2 class="section-title" data-bind="rsvp.title"></h2>
        <p class="section-sub" data-bind="rsvp.subtitle"></p>

        <form id="rsvp-form" class="form" novalidate>
          <div class="field-group attending-group" role="radiogroup" id="attending-group">
            <label class="attending-option">
              <input type="radio" name="attending" value="yes" required>
              <span data-bind-text="rsvp.yes"></span>
            </label>
            <label class="attending-option">
              <input type="radio" name="attending" value="no" required>
              <span data-bind-text="rsvp.no"></span>
            </label>
          </div>

          <div class="field">
            <label for="rsvp-dietary" data-bind-text="rsvp.dietaryLabel"></label>
            <input type="text" id="rsvp-dietary" name="dietary" autocomplete="off">
          </div>

          <div class="field">
            <label for="rsvp-message" data-bind-text="rsvp.messageLabel"></label>
            <textarea id="rsvp-message" name="message" rows="3" data-bind-attr-placeholder="rsvp.messagePlaceholder"></textarea>
          </div>

          <!-- honeypot: hidden from real guests, real users never fill this in -->
          <div class="hp-field" aria-hidden="true">
            <label for="rsvp-website">Website</label>
            <input type="text" id="rsvp-website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <button type="submit" class="btn btn-solid" data-bind-text="rsvp.submit"></button>

          <p class="form-status" id="rsvp-status" role="status" aria-live="polite" hidden></p>
        </form>

        <div class="ask">
          <h3 class="sub-title" data-bind="questions.title"></h3>
          <form id="question-form" class="form" novalidate>
            <div class="field">
              <label for="question-text" class="sr-only" data-bind-text="questions.title"></label>
              <textarea id="question-text" name="message" rows="3" required data-bind-attr-placeholder="questions.placeholder"></textarea>
            </div>
            <div class="hp-field" aria-hidden="true">
              <label for="question-website">Website</label>
              <input type="text" id="question-website" name="website" tabindex="-1" autocomplete="off">
            </div>
            <button type="submit" class="btn btn-line" data-bind-text="questions.submit"></button>
            <p class="form-status" id="question-status" role="status" aria-live="polite" hidden></p>
          </form>
        </div>
      </section>

      <section id="faq" class="section faq">
        <p class="kicker" data-bind="faq.kicker"></p>
        <div class="faq-list" id="faq-list"><!-- populated by render.js --></div>
      </section>

      <footer class="site-footer">
        <p class="footer-mark" aria-hidden="true">&#10022;</p>
        <p data-bind="footer.note"></p>
      </footer>

    </main>
  </div>

  <script src="js/config.js?v=35b0850f" defer></script>
  <script src="js/render.js?v=68e31551" defer></script>
  <script src="js/i18n.js?v=be49d91f" defer></script>
  <script src="js/envelope.js?v=e0fccd62" defer></script>
  <script src="js/letter.js?v=9829543e" defer></script>
  <script src="js/paging.js?v=846bc5ab" defer></script>
  <script src="js/main.js?v=0d73c6c2" defer></script>
  <script src="js/unlock.js?v=4085fe4a" defer></script>
</body>
</html>
